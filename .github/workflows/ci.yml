name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, pruebas unitarias e imágenes
        run: npm test
      - name: Pruebas SQL (migraciones, RLS, flujo de compra, primer admin)
        run: bash scripts/test-db.sh
      - name: Pruebas de integración de pagos (pasarela simulada)
        run: |
          psql -c "create database pay_ci"
          psql -d pay_ci -q -f supabase/tests/00_supabase_stub.sql
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pay_ci node scripts/db-setup.mjs
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pay_ci npm run test:payments
      - name: Build de producción
        run: npm run build:app
